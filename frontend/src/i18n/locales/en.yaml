set_promo_demote_tolerate_last_ep_label: "Tolerate missing subtitles on the last episode (airing)"
set_promo_demote_tolerate_last_ep_sub: "If a new episode has just aired and doesn't have subtitles yet, it doesn't count as an error."
set_promo_demote_tolerate_last_ep_example: "Example: the anime has 8 episodes, ep 8 aired yesterday without subtitles → the series stays published."
set_promo_pct_threshold_label: "Percentage threshold for demotion"
set_promo_pct_threshold_sub: "If CS subtitles are missing for more than X% of episodes, the series is always demoted regardless of other rules."
set_promo_pct_threshold_example: "Example: at 10% — anime with 24 episodes where subtitles are missing for 3 or more episodes will be demoted."
set_promo_multi_threshold_label: "Demotion threshold — middle episodes (airing)"
set_promo_multi_threshold_sub: "The number of missing CS subtitles among middle episodes of an airing anime after which the series is demoted."
set_promo_multi_threshold_example: "Example: at 2 — an airing anime missing subtitles for episodes 3 and 7 (not the last one) will be demoted."
set_promo_completed_threshold_label: "Demotion threshold — completed anime"
set_promo_completed_threshold_sub: "The number of episodes without CS subtitles after which a completed anime is automatically demoted."
set_promo_completed_threshold_example: "Example: at 2 — anime with 12 episodes missing subtitles for episodes 5 and 8 will be demoted."
set_promo_cooldown_label: "Protection period after promotion"
set_promo_cooldown_sub: "How many hours after promotion the series cannot be automatically demoted (protection against 'flapping')"
set_promo_cooldown_none: "no protection"
set_promo_cooldown_one_week: "1 week"
set_promo_cooldown_hours_suffix: "hours"
set_promo_audit_group_title: "Subtitle audit (state machine)"
set_promo_audit_group_sub: "Logic for determining series state: CLEAN / PENDING / ABANDONED / DAMAGED / PARTIAL / PENDING_TRANSLATION"
set_promo_audit_enabled_label: "Enable audit"
set_promo_audit_enabled_sub: "Regularly, and after every relevant change, re-evaluates audit_status for every series"
set_promo_audit_tail_high_label: "High tolerance for series tail (days)"
set_promo_audit_tail_high_sub: "If the last episode is younger than X days, missing subtitles at the end of the series (tail) are tolerated without a count limit."
set_promo_audit_tail_high_example: "Example: a new episode aired yesterday without subtitles → still PENDING, not PARTIAL."
set_promo_audit_tail_low_label: "Low tolerance for series tail (days)"
set_promo_audit_tail_low_sub: "Between the high tolerance and this limit (in days), missing tail subtitles are tolerated only up to the max. episode count below"
set_promo_audit_tail_low_max_label: "Max. episodes in low tolerance"
set_promo_audit_tail_low_max_sub: "The maximum number of episodes without subtitles at the end of the series still tolerated within the 'low tolerance'."
set_promo_audit_tail_low_max_example: "Beyond this limit of both days and episode count, the state becomes PARTIAL / ABANDONED."
set_promo_audit_hiyori_label: "hiyori.cz check interval (hours)"
set_promo_audit_hiyori_sub: "How often, before assigning ABANDONED, hiyori.cz is checked to see if the series is planned / revived (→ PENDING_TRANSLATION)"

