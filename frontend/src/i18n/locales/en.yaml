set_promo_demote_full_missing_label: "Demote if all subtitles are missing"
set_promo_demote_full_missing_sub: "A promoted series with not a single CS subtitle is automatically demoted"
set_promo_protect_completed_label: "Protect completed series"
set_promo_protect_completed_sub: "Don't demote series with Ended status if they have ≥ 50% CS subtitles"
