# Czech (cs) — source language. Flat key: value pairs, one-to-one with the
# other locale files (sk.yaml, en.yaml). Adding a new language later = adding
# one more locales/<code>.yaml file with the same keys as this one, then
# registering it in translations.js + LANGUAGE_OPTIONS.
# Anime synopses/descriptions are AI-translated data content, not UI chrome,
# and are deliberately NOT part of this dictionary.

