name: Backend tests

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-core.txt

      # Core deps only — ffsubsync (webrtcvad) needs a compiler and isn't
      # touched by the smoke tests; the Docker build covers the full set.
      - name: Install dependencies
        run: pip install -r backend/requirements-core.txt pytest

      - name: Run smoke tests
        working-directory: backend
        run: python -m pytest -q tests
